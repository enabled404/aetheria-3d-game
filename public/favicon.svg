<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#060d1a"/>
  <defs>
    <linearGradient id="runeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="32,10 46,26 42,50 32,54 22,50 18,26" fill="url(#runeGrad)" filter="url(#glow)" opacity="0.95"/>
  <polygon points="32,12 40,26 32,51 24,26" fill="#ffffff" opacity="0.45"/>
  <circle cx="32" cy="30" r="3" fill="#ffffff" filter="url(#glow)"/>
</svg>
